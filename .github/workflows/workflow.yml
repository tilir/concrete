name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++-14
            build_type: Release
            build_dir: release-gcc
            coverage: false

          - compiler: clang++-18
            build_type: Debug
            build_dir: debug-clang
            coverage: true

          - compiler: clang++-18
            build_type: Debug
            build_dir: sanitizers-clang
            coverage: false
            sanitizers: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Show toolchain versions
        run: |
          ${{ matrix.compiler }} --version
          cmake --version
          ninja --version
          ruby --version

      - name: Configure
        run: |
          cmake -G Ninja \
            -S . \
            -B ${{ matrix.build_dir }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_COVERAGE=${{ matrix.coverage }} \
            -DENABLE_SANITIZERS=${{ matrix.sanitizers || false }} \
            -DLLVM_COV=llvm-cov-18 \
            -DLLVM_PROFDATA=llvm-profdata-18

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Test
        if: ${{ !matrix.coverage }}
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure

      - name: Generate coverage report
        if: ${{ matrix.coverage }}
        run: |
          cmake --build ${{ matrix.build_dir }} --target coverage-report \
            | tee ${{ matrix.build_dir }}/coverage-report.txt

      - name: Add coverage report to job summary
        if: ${{ matrix.coverage }}
        run: |
          {
            echo "## Coverage report"
            echo
            echo '```text'
            cat ${{ matrix.build_dir }}/coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML coverage
        if: ${{ matrix.coverage }}
        run: cmake --build ${{ matrix.build_dir }} --target coverage-html

      - name: Upload HTML coverage artifact
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-html
          path: ${{ matrix.build_dir }}/coverage-html
